name: "🗂️ Epic"
description: "Outcome ใหญ่ที่ต้องแตก child issue หลายใบ"
title: "[Epic] "
labels: ["epic"]
body:
  - type: markdown
    attributes:
      value: "Epic เป็นทะเบียนแม่ · defect/task ที่ assign หรือปิดแยกได้ต้องเป็น child issue"
  - type: textarea
    id: goal
    attributes:
      label: "เป้าหมาย"
    validations:
      required: true
  - type: textarea
    id: measurable_outcome
    attributes:
      label: "ผลลัพธ์ที่วัดได้"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "ขอบเขต"
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: "Child issues"
      placeholder: "- [ ] #123 — ..."
    validations:
      required: true
  - type: textarea
    id: exit_criteria
    attributes:
      label: "Exit criteria"
      placeholder: "- [ ] ..."
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: Module
      description: "Area/module ที่เป็นเจ้าของงาน เช่น MRP, PWOC, MES, WMS หรือ Cross-module"
    validations:
      required: true
  - type: dropdown
    id: change_risk
    attributes:
      label: Change risk
      description: "ความเสี่ยงจากการ merge/deploy ไม่ใช่ Severity หรือ Delivery Health"
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
  - type: dropdown
    id: primary_executor
    attributes:
      label: Primary executor
      options:
        - Human
        - Claude Code
        - Codex
        - Grok
        - Mixed
    validations:
      required: true
  - type: textarea
    id: shared_resource_claims
    attributes:
      label: Shared-resource claims
      description: >-
        Account/SB, subsidiary, location, setup record, deploy file,
        QA browser หรือ none
      value: "none"
    validations:
      required: true
